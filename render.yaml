# Render Blueprint — single origin (API + SPA)
# Frontend is built during deploy and served by Express from frontend/dist.
# Set VITE_* so the SPA calls the same host for API and Socket.IO.

services:
  - type: web
    name: education-center-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: QUESTION_BANK_BUCKET
        value: question-bank
      # Đồng bộ sổ buổi học sang Google Sheets. Thiếu thì trang vẫn chạy, chỉ
      # không ghi sang Sheet. Dán nguyên nội dung file service account JSON
      # vào một dòng; Render không có hệ thống file cố định nên không dùng
      # được GOOGLE_SERVICE_ACCOUNT_FILE ở đây.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      # Same-origin SPA: set both to your Render public URL (no trailing slash)
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
